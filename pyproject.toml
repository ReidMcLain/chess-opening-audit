[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-opening-audit"
version = "0.1.0"
description = "A reproducible local audit of chess openings from PGN archives"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["python-chess>=1.999,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chess-opening-audit = "chess_audit.cli:main"

[tool.setuptools]
packages = ["chess_audit"]

[tool.setuptools.data-files]
"share/chess-opening-audit/data" = [
  "data/openings.tsv",
  "data/metadata.json",
  "data/README.md",
  "data/COPYING-lichess-chess-openings.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
